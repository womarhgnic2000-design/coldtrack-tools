<script type="application/json" id="coldtrack-language-copy">{"copy":[["Centro de herramientas","Tool center"],["Centro de datos","Data center"],["Datos","Data"],["Sin movimiento","Without movement"],["Ítems sin movimiento","Items without movement"],["Archivos compartidos","Shared files"],["Rotación de inventario","Inventory turnover"],["Cargá inventario, uso semanal, actividades y el PDF diario una sola vez. Revisá fechas y compartí los archivos con las herramientas.","Upload inventory, weekly usage, activities and the daily PDF once. Review dates and share the files with your tools."],["Detectá ítems sin salidas, revisá la última actividad y las semanas de uso. Filtrá por cliente y ubicación y descargá el reporte.","Find items without outbound activity, review their latest activity and usage weeks. Filter by client and location and download the report."],["COLDTRACK · OPERACIONES","COLDTRACK · OPERATIONS"],["Herramientas","Tools"],["5 herramientas disponibles","5 tools available"],["6 herramientas disponibles","6 tools available"],["Qué contar hoy","What to count today"],["Conteos cíclicos","Cycle counts"],["Conteos","Counts"],["Cargá el inventario, priorizá ubicaciones y registrá conteos. Exportá PDF con QR de lote, expiración y LPN.","Upload inventory, prioritize locations and record counts. Export PDFs with lot, expiration and LPN QR codes."],["Elegí la herramienta que necesitás para planificar el trabajo y organizar el inventario.","Choose a tool to plan work and organize inventory."],["Elegí tu sección y abrí la herramienta que necesitás.","Choose your section and open the tool you need."],["CONSULTA DE INVENTARIO","INVENTORY LOOKUP"],["PLANIFICACIÓN Y CONTROL","PLANNING AND CONTROL"],["Acceso directo","Direct access"],["Con contraseña","Password required"],["Herramientas de Supervisor","Supervisor tools"],["Forecasting, Pressed, BOL, conteos, documentos y Red Flags.","Forecasting, Pressed, BOL, counts, documents and Red Flags."],["Forecasting, Pressed, BOL, conteos, documentos, incidencias y Red Flags.","Forecasting, Pressed, BOL, counts, documents, incidents and Red Flags."],["Incidencias de producto","Product incidents"],["Registro de incidencias","Issue register"],["Operaciones y calidad","Operations and quality"],["Registrá problemas de producto, cantidades, ubicaciones, recibo o despacho. Adjuntá fotos, llevá el seguimiento y descargá el reporte PDF.","Record product, quantity, location, receiving or shipping issues. Attach photos, track follow-up and download a PDF report."],["Incidencias","Incidents"],["Calidad y empaque","Quality and packaging"],["Registrá diferencias entre la caja y su contenido, cantidades y fotos. Guardá el hallazgo y prepará un reporte PDF para revisión.","Record differences between the case and its contents, quantities and photos. Save the finding and prepare a PDF for review."],["Ingresá la contraseña para ver y usar estas herramientas.","Enter the password to view and use these tools."],["Entrar a Supervisor","Enter Supervisor"],["Bloquear sección","Lock section"],["Proyección de inventario","Inventory forecast"],["Anticipá lotes en riesgo y revisá la secuencia PF → A1/A2 → reserva. Prepará reportes y etiquetas Zebra.","Anticipate at-risk lots and review the PF → A1/A2 → reserve sequence. Prepare reports and Zebra labels."],["Abrir herramienta","Open tool"],["Despachos","Shipping"],["Prepará el documento de embarque, agregá productos y exportá el BOL en PDF con sus datos e historial.","Prepare the shipping document, add products and export a PDF BOL with its data and history."],["Documentos","Documents"],["Certificado de destrucción","Certificate of destruction"],["Documentá productos, cantidades, autorizaciones y evidencia fotográfica. Generá el certificado en PDF.","Document products, quantities, authorization and photo evidence. Generate a PDF certificate."],["Calidad","Quality"],["Acción correctiva","Corrective Action"],["Prepará acciones correctivas, registrá auditorías y fotos, y conservá tus reportes en HTML, PDF o datos.","Prepare corrective actions, record audits and photos, and keep reports as HTML, PDF or data."],["Inventario","Inventory"],["Buscador de inventario","Inventory finder"],["Buscá productos por número, nombre o ubicación y filtrá los resultados por pasillo.","Search by item number, name or location and filter results by aisle."],["ColdTrack · Planificación e inventario","ColdTrack · Planning and inventory"],["Destrucción","Destruction"],["Buscador","Finder"],["Anticipá qué lotes podrían llegar al límite de envío con unidades sobrantes.","Anticipate which lots may reach the shipping cutoff with units remaining."],["Inventario de referencia","Inventory snapshot"],["Unidades: unidades","Unit of measure: units"],["Cuándo aparecería el riesgo","When risk would appear"],["Cada barra muestra nuevas unidades que llegarían al corte ese día. Tocá una fecha para ampliar el horizonte.","Each bar shows additional units reaching cutoff that day. Select a date to extend the horizon."],["Unidades estimadas al corte","Estimated units at cutoff"],["Ya fuera del plazo de envío","Already past the shipping cutoff"],["Unidades que podrían quedar al corte","Units that may remain at cutoff"],["Lotes por atender","Lots to review"],["Próximo problema","Next issue"],["Secuencia de consumo","Consumption sequence"],["PF → Stockers A1/A2 → Reserva B/C/D","PF → Stockers A1/A2 → Reserve B/C/D"],["Revisando…","Reviewing…"],["Ítems con fechas fuera de secuencia","Items with out-of-sequence dates"],["Comparaciones con alerta","Flagged comparisons"],["Unidades con fecha anterior atrás","Earlier-expiring units in later locations"],["Todas","All"],["PF → Reserva","PF → Reserve"],["A1/A2 → Reserva","A1/A2 → Reserve"],["Buscar en secuencia por ítem, lote o ubicación","Search sequence by item, lot or location"],["Ítem, lote o ubicación…","Item, lot or location…"],["Descargar PDF","Download PDF"],["Descargar revisión CSV","Download review CSV"],["Ítem","Item"],["Sale antes por ubicación","Consumed first by location"],["Vence antes y está atrás","Expires first in a later location"],["Revisión","Review"],["← Anterior","← Previous"],["Siguiente →","Next →"],["Reglas y datos sin comparar","Rules and excluded data"],["PF se consume primero. Las ubicaciones SD que terminan en A1 o A2 son preferidas para stockers. Las SD que terminan en B, C o D, con o sin número de nivel, son reserva. A1 y A2 comparten prioridad; B, C y D también.","PF is consumed first. SD locations ending in A1 or A2 are preferred stocker locations. SD locations ending in B, C or D, with or without a level number, are reserve. A1 and A2 have equal priority; so do B, C and D."],["Esta revisión detecta fechas fuera de orden en el inventario cargado. Las salidas reales se confirman con un historial de movimientos por lote. La proyección de arriba supone consumo por vencimiento; esta sección revisa si la ubicación física permite ese orden.","This review detects dates out of order in the uploaded inventory. Actual consumption requires movement history by lot. The forecast above assumes consumption by expiration; this section checks whether physical locations support that order."],["Lotes por nivel de riesgo","Lots by risk level"],["Buscar ítem, lote o ubicación","Search item, lot or location"],["Buscar ítem, lote, ubicación…","Search item, lot, location…"],["El plazo elegido se aplica a las cuatro columnas.","The selected horizon applies to all four columns."],["Un problema futuro, visible hoy","A future issue, visible today"],["Para adelantar trabajo","Plan work ahead"],["Cómo se calcula","How it is calculated"],["Weekly usage ÷ días de despacho = salida diaria estimada por ítem.","Weekly usage ÷ shipping days = estimated daily usage per item."],["Las salidas se reparten por vencimiento, usando primero los lotes con menor vida útil.","Usage is allocated by expiration, consuming the earliest-expiring lots first."],["Cada lote deja de consumirse en la proyección al llegar a su corte de envío.","Each lot stops being consumed in the forecast when it reaches its shipping cutoff."],["Las unidades que queden en ese momento se muestran en riesgo.","Units remaining at that point are shown as at risk."],["Se incluye el despacho estimado de la fecha del inventario. El escenario usa demanda uniforme y las existencias cargadas, sin nuevas entradas. Los resultados son estimaciones.","Estimated shipping on the inventory date is included. The scenario assumes uniform demand and uploaded stock, with no new receipts. Results are estimates."],["Datos y configuración","Data and settings"],["Actualizá los archivos y ajustá las reglas de la proyección.","Update files and adjust forecast rules."],["Uso semanal","Weekly usage"],["Subir Excel","Upload Excel"],["Ver datos","View data"],["Inventario disponible","On-hand inventory"],["Descargar plantilla","Download template"],["Ajustar reglas ⌄","Adjust rules ⌄"],["Ver ejemplo del Excel de inventario","View inventory Excel example"],["Fecha del inventario","Inventory date"],["Fecha de referencia del reporte de stock, no la fecha de creación de cada fila.","Reference date of the stock report, rather than the creation date of each row."],["Corte antes de expirar (días)","Cutoff before expiration (days)"],["Con 14, se deja de enviar cuando quedan 14 días o menos. Ajustalo a la regla de Pressed.","With 14, shipping stops when 14 days or fewer remain. Adjust to Pressed's rule."],["Semanas para el promedio","Weeks to average"],["Última semana del archivo","Last week in the file"],["Últimas 4 semanas del archivo","Last 4 weeks in the file"],["Últimas 8 semanas del archivo","Last 8 weeks in the file"],["Todas las semanas del archivo","All weeks in the file"],["Días de despacho","Shipping days"],["Lunes a viernes · 5 días","Monday to Friday · 5 days"],["Lunes a sábado · 6 días","Monday to Saturday · 6 days"],["Todos los días · 7 días","Every day · 7 days"],["El promedio semanal se divide entre estos días.","Weekly average is divided by these days."],["Escenario de consumo","Usage scenario"],["Probá qué pasaría si las salidas bajaran o subieran.","Try what happens if usage decreases or increases."],["Mirar los próximos","Look ahead"],["Proyección desde tus reportes.","Forecast from your reports."],["Restablecer ejemplo ↺","Reset example ↺"],["Restablecer datos iniciales ↺","Reset initial data ↺"],["Explorá los datos del ejemplo","Explore the example data"],["Revisá los reportes cargados.","Review the uploaded reports."],["Ítem / lote","Item / lot"],["Ubicación","Location"],["Unidades","Units"],["Expiración","Expiration"],["Motivo","Reason"],["Unidades por semana","Units per week"],["Unidad","Unit"],["Para actualizar los datos, subí un nuevo Excel.","Upload a new Excel file to update the data."],["Cerrar","Close"],["Reporte para el equipo","Team report"],["Lotes por revisar según el plazo y la búsqueda de la pantalla.","Lots to review based on the horizon and search on screen."],["Incluir lotes sin sobrante previsto","Include lots with no expected remainder"],["Lotes incluidos","Included lots"],["Ya en corte","Already at cutoff"],["Riesgo futuro estimado","Estimated future risk"],["Para compartir o imprimir. Incluye todas las ubicaciones de cada lote.","Share or print. Includes all locations for each lot."],["Abrir en Excel (.csv)","Open in Excel (.csv)"],["Una fila por lote para ordenar, filtrar y trabajar con los datos.","One row per lot to sort, filter and work with the data."],["Etiqueta de locación · EXP-HOLD","Location label · EXP-HOLD"],["Imprimí el QR en una etiqueta 4×6 con tu Zebra y un bridge local.","Print the QR on a 4×6 label using your Zebra and a local bridge."],["Etiqueta Zebra ↗","Zebra label ↗"],["No hay lotes para descargar con estos filtros. Ampliá el plazo, cambiá la búsqueda o incluí los lotes sin sobrante.","No lots match these filters. Extend the horizon, change the search or include lots with no remainder."],["Las cantidades futuras son estimaciones para revisión física.","Future quantities are estimates for physical review."],["Así se ve el Excel de inventario","Inventory Excel format"],["Encabezados del reporte de Deposco y tres filas con datos ficticios. Deslizá la tabla horizontalmente para ver todas las columnas.","Deposco report headers and three sample rows. Scroll horizontally to see all columns."],["La plantilla está vacía y usa las 8 columnas necesarias. Completala desde la fila 7; el reporte completo de Deposco también funciona.","The template is blank and uses the 8 required columns. Fill it from row 7; the full Deposco report also works."],["es la cantidad que usa la proyección. Ejemplo: Quantity = 10 y Total Units = 240 → se calculan 240 unidades.","is the quantity used in the forecast. Example: Quantity = 10 and Total Units = 240 → 240 units are used."],["es la fecha de expiración. Por ejemplo: 2026-12-24. Mantené los encabezados tal como aparecen en el reporte.","is the expiration date. For example: 2026-12-24. Keep report headers unchanged."],["Una fila por registro de stock. El HTML agrupa después por ítem, lote y expiración.","One row per stock record. The tool groups rows by item, lot and expiration."],["Descargar plantilla Excel","Download Excel template"],["Entendido","Got it"],["Descargar reporte","Download report"],["DATOS CARGADOS","DATA LOADED"],["Imprimir","Print"],["Descargar HTML","Download HTML"],["Prepará el embarque, cargá tus productos y generá el documento.","Prepare the shipment, enter products and generate the document."],["Documentá productos, autorizaciones y evidencia de la destrucción.","Document products, authorization and destruction evidence."],["Gestioná acciones correctivas, auditorías y evidencia.","Manage corrective actions, audits and evidence."],["Encontrá un producto y consultá su ubicación.","Find an item and look up its location."],["Más opciones","More options"],["Crear · guardar · exportar","Create · save · export"],["+ Nuevo BOL","+ New BOL"],["Guardar historial","Save to history"],["Exportar PDF + datos","Export PDF + data"],["Elegir carpeta","Choose folder"],["Respaldar historial","Back up history"],["Importar respaldo / BOL","Import backup / BOL"],["Crear BOL desde Excel","Create BOL from Excel"],["Subí un archivo, revisá los productos y generá el BOL.","Upload a file, review products and generate the BOL."],["Archivo Excel (.xlsx)","Excel file (.xlsx)"],["Descargar plantilla de ejemplo","Download example template"],["Máximo 10 MB. Un embarque por hoja. Los datos se procesan en este navegador. La plantilla incluye datos de ejemplo que debés reemplazar.","Maximum 10 MB. One shipment per sheet. Data is processed in this browser. Replace the example data in the template."],["Elegí tu Excel para comenzar.","Choose your Excel file to begin."],["Hoja de productos","Products sheet"],["Fila de encabezados","Header row"],["Revisar o ajustar columnas","Review or adjust columns"],["Los campos con * son obligatorios. Cantidad se importa tal como viene; no se convierten cajas ni unidades. Pallets y peso se suman por fila. Fechas: MM/DD/AAAA o AAAA-MM-DD.","Fields marked * are required. Quantity is imported as provided; cases and units are not converted. Pallets and weight are summed by row. Dates: MM/DD/YYYY or YYYY-MM-DD."],["Datos de embarque (opcionales)","Shipment data (optional)"],["Vista previa","Preview"],["Fila","Row"],["Generar abre un BOL nuevo y reemplaza el formulario actual. Guardá primero cualquier cambio que necesités conservar.","Generate opens a new BOL and replaces the current form. Save any changes you want to keep first."],["Generar BOL","Generate BOL"],["Listo. Elige una carpeta para guardar los PDF y sus datos; si no, se descargarán.","Ready. Choose a folder for PDFs and data; otherwise they will be downloaded."],["Los cambios guardados se sincronizan con el equipo. Usa Chrome o Edge para elegir carpeta. La carpeta se vuelve a elegir al abrir el archivo. El historial guardado se comparte con tu equipo.","Work entos de embarque, destrucción y acciones correctivas.","Shipping, destruction and corrective action documents."],["Archivos de inventario, consumo y actividad para las herramientas.","Inventory, usage and activity files for the tools."],["Lavado de manos","Handwashing"],["Higiene y capacitación","Hygiene and training"],["Consultá los cinco pasos ilustrados, practicá con el temporizador y descargá un cartel PDF en español o inglés.","Review the five illustrated steps, practice with the timer and download a poster PDF in Spanish or English."],["Plan de Forecasting / Picking","Forecasting / Picking plan"],["Confirmo que las cantidades corregidas representan el contenido completo de cada LPN. No estoy fraccionando pallets.","I confirm that the corrected quantities represent the full contents of each LPN. I am not splitting pallets."],["Se conserva el plan original como referencia. En cada LPN, contá 1 pallet en la primera línea y 0 en sus líneas adicionales.","The original plan is retained as a reference. Count 1 pallet on the first line of each LPN and 0 on additional lines."],["Podés editar cualquier BOL, incluso los de Forecasting y Picking. Para cambiar uno guardado, abrilo en el historial, modificá los campos y guardalo otra vez.","You can edit any BOL, including Forecasting and Picking documents. To change a saved BOL, open it in history, edit the fields and save it again."],["Usá cantidades mayores que cero y un número entero de pallets.","Use positive quantities and a whole number of pallets."],["El BOL debe incluir al menos un pallet completo.","The BOL must include at least one whole pallet."],["Revisá el traslado antes de cargarlo. El BOL actual se conserva hasta aceptar este plan. Después podés editar el documento y completar direcciones y peso.","Review the transfer before loading it. The current BOL is retained until you accept this plan. You can then edit the document and complete addresses and weight."],["Plan cargado. Revisá los pallets y completá direcciones y peso. Podés editar el BOL y volver a guardarlo.","Plan loaded. Review pallets and complete addresses and weight. You can edit and save the BOL again."],["Elegí la fecha del traslado, calculá pallets completos y prepará el picking PDF. Seleccioná los pallets del envío para crear un BOL editable.","Choose the movement date, calculate whole pallets and prepare the picking PDF. Select shipment pallets to create an editable BOL."],["Prepará, reabrí y modificá tus BOL. Importá Excel o pallets de Forecasting y Picking y exportá el PDF con sus datos.","Prepare, reopen and edit your BOLs. Import Excel or pallets from Forecasting and Picking and export the PDF with its data."],["8 herramientas disponibles","8 tools available"],["Red Flags de inventario","Inventory Red Flags"],["Detectá fechas inconsistentes, cantidades negativas y ajustes repetidos. Revisá la evidencia y los movimientos de cada caso.","Detect inconsistent dates, negative quantities and repeated adjustments. Review the evidence and movements for each case."],["Cargá tus reportes. Encontrá qué revisar. Abrí la evidencia de cada caso.","Upload your reports. Find what to review. Open the evidence for each case."],["1. Inventario actual","1. Current inventory"],["Stock Unit de Deposco · XLSX, CSV o TSV","Deposco Stock Unit · XLSX, CSV or TSV"],["Cargar reporte de inventario","Upload inventory report"],["2. Historial de actividad","2. Activity history"],["Activity Log · opcional para las alertas de inventario","Activity Log · optional for inventory alerts"],["Cargar historial de actividad","Upload activity history"],["Sin archivo cargado","No file loaded"],["Cancelar y limpiar","Cancel and clear"],["Los archivos se procesan en este navegador. No se envían a servidores. El historial grande conviene cargarlo desde una computadora. No hay conexión automática con Deposco.","Files are processed in this browser and are not sent to servers. Large activity files are best loaded on a computer. There is no automatic Deposco connection."],["Fecha para revisar vencimientos","Expiration review date"],["Corte del inventario (hora del reporte)","Inventory cutoff (report time)"],["Avisar desde estos ajustes por ítem","Alert from this many adjustments per item"],["Analizar reportes","Analyze reports"],["Incluir Shipping, Damaged y Quarantine","Include Shipping, Damaged and Quarantine"],["Revisar posibles oportunidades de FEFO","Review possible FEFO opportunities"],["Confirmá la fecha y hora del corte antes de analizar.","Confirm the cutoff date and time before analyzing."],["Casos detectados","Cases detected"],["Prioridad alta","High priority"],["Pendientes o investigando","Pending or investigating"],["Filas de inventario","Inventory rows"],["Casos para investigar","Cases to investigate"],["Exportar casos CSV","Export cases CSV"],["Respaldar notas","Back up notes"],["Restaurar notas","Restore notes"],["Ítem, lote, ubicación o descripción","Item, lot, location or description"],["Buscar casos","Search cases"],["Filtrar cliente","Filter client"],["Todas las alertas","All alerts"],["Filtrar alerta","Filter alert"],["Todas las prioridades","All priorities"],["Filtrar prioridad","Filter priority"],["Cualquier estado","Any status"],["Filtrar revisión","Filter review"],["Alta","High"],["Media","Medium"],["Revisar","Review"],["Pendiente","Pending"],["Investigando","Investigating"],["Verificado","Verified"],["Cargá el inventario para comenzar.","Upload inventory to begin."],["El historial agrega contexto y la revisión de ajustes repetidos.","History adds context and repeated-adjustment checks."],["Qué detecta y cómo interpretar las alertas","What it detects and how to interpret alerts"],["Fechas distintas:","Conflicting dates:"],["agrupa cliente + ítem + lote, con cantidad positiva. Compara las fechas no vacías. No decide cuál es correcta.","Groups client + item + lot with positive quantities. Compares nonempty dates without deciding which is correct."],["Vencido:","Expired:"],["expiración anterior a la fecha seleccionada, con unidades positivas. La fecha de hoy no se considera vencida. Una fecha de hace más de diez años se muestra como sospechosa en vez de duplicar la alerta.","Expiration before the selected date, with positive units. Today's date is not considered expired. A date more than ten years old is flagged as suspicious instead of duplicating the alert."],["Lote faltante:","Missing lot:"],["ítem con Lot Tracking Enabled = true y lote vacío. Requiere revisar si el flujo permite esa situación.","An item with Lot Tracking Enabled = true and an empty lot. Review whether the workflow permits this situation."],["Cantidad negativa:","Negative quantity:"],["Total Units menor a cero. Las filas con unidades ilegibles no se convierten en cero: se informa cuántas se excluyeron.","Total Units below zero. Unreadable quantities are not converted to zero; excluded rows are counted."],["Ajustes repetidos:","Repeated adjustments:"],["eventos “Adjust Inventory” por cliente e ítem, hasta el corte seleccionado. Se deduplican por Transaction # o ID; el umbral inicial es 3. No se suman cantidades ni se infiere si fueron entradas o salidas. Incluye ítems sin stock actual; esos casos se identifican como “sin registro en inventario cargado”.","Adjust Inventory events by client and item through the selected cutoff. Deduplicated by Transaction # or ID; the initial threshold is 3. Quantities are not summed and no inbound or outbound direction is inferred. Items without current stock are included and identified as absent from the loaded inventory."],["FEFO a revisar:","FEFO to review:"],["reserva con fecha anterior a picking, fechas no vencidas, Location Status = Ready y Status vacío. No comprueba restricciones de cliente, QA o disponibilidad. Si faltan esos campos, esta revisión no se ejecuta para esas filas.","Reserve stock dated earlier than picking, with unexpired dates, Location Status = Ready and an empty Status. Client, QA and availability restrictions are not checked. Rows missing those fields are excluded from this check."],["Alcance:","Scope:"],["por defecto se excluyen Shipping, Damaged y Quarantine según tipo de ubicación o locator. Los registros de clientes diferentes no se mezclan. El código de cliente se relaciona por nombre normalizado; Se relacionan Pressed Juicery Inc con PressedJuicery, Force Of Nature con FON y Maui Nui Venison con MauiNui. Si otro código no coincide, no se fuerza la relación.","By default, Shipping, Damaged and Quarantine are excluded by storage type or locator. Different clients are not mixed. Client codes are matched by normalized name; Pressed Juicery Inc matches PressedJuicery, Force Of Nature matches FON, and Maui Nui Venison matches MauiNui. Other unmatched codes are not forced to match."],["Historial:","History:"],["conserva los 100 movimientos relacionados más recientes por cliente e ítem, además de todos los eventos de ajuste del archivo. Una coincidencia por ítem aporta contexto; no demuestra que un movimiento causó la alerta. La ausencia de un movimiento en el archivo no prueba que nunca ocurrió.","Keeps the 100 most recent related movements per client and item, plus all adjustment events in the file. An item match provides context and does not prove that a movement caused the alert. An absent movement does not prove it never happened."],["Corte:","Cutoff:"],["las horas se comparan tal como aparecen en Deposco, sin convertir zona horaria. Los movimientos posteriores se muestran aparte y no se usan para contar ajustes anteriores.","Times are compared as displayed in Deposco, without timezone conversion. Later movements appear separately and do not count toward earlier adjustments."],["Seguimiento:","Follow-up:"],["las notas quedan en este navegador, ligadas al caso y a su evidencia. Respaldalas como JSON para llevarlas a otro equipo. Al cerrar la página hay que volver a cargar los Excel.","Notes stay in this browser, linked to each case and its evidence. Back them up as JSON to move the <script id="coldtrack-language-core">"use strict";
(() => {
  const dictionary=JSON.parse(document.getElementById('coldtrack-language-copy').textContent),key='coldtrack-language-v1';
  const maps={es:new Map(),en:new Map()},phrase={es:[],en:[]};
  const normalized=value=>String(value).replace(/\s+/g,' ').trim();
  const escape=value=>value.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  for(const [es,en] of dictionary.copy){
    if(!maps.en.has(normalized(es)))maps.en.set(normalized(es),en);
    if(!maps.es.has(normalized(en)))maps.es.set(normalized(en),es);
  }
  const patterns={es:[],en:[]};
  for(const [es,en] of dictionary.rules)for(const [lang,from,to] of [['en',es,en],['es',en,es]]){
    const slots=[];let cursor=0,source='';
    for(const match of from.matchAll(/\{(\d+)\}/g)){source+=escape(from.slice(cursor,match.index))+'([\\s\\S]*?)';slots.push(match[1]);cursor=match.index+match[0].length;}
    source+=escape(from.slice(cursor));patterns[lang].push({regex:new RegExp('^'+source+'$'),slots,to});
  }
  for(const lang of ['es','en']){
    const entries=[...maps[lang]].filter(([from,to])=>from!==to&&from.length>=3).sort((a,b)=>b[0].length-a[0].length);
    if(entries.length)phrase[lang]={regex:new RegExp('(?<![\\p{L}\\p{N}_])(?:'+entries.map(([from])=>escape(from)).join('|')+')(?![\\p{L}\\p{N}_])','gu'),entries:new Map(entries)};
  }
  let language='es';
  try{language=window.parent!==window&&window.parent.ColdTrackLanguage?window.parent.ColdTrackLanguage.current:localStorage.getItem(key)||document.documentElement.dataset.ctLanguage||'es';}catch(_){language=document.documentElement.dataset.ctLanguage||'es';}
  if(!['es','en'].includes(language))language='es';
  function t(value,lang=language){
    const finish=value=>lang==='en'?value.replace(/\b1 (items|lots|days|comparisons|records|locations)\b/g,(_,word)=>'1 '+word.slice(0,-1)):value;
    const text=String(value??''),trimmed=normalized(text),exact=maps[lang]?.get(trimmed);
    if(exact!==undefined)return finish(text.match(/^\s*/)[0]+exact+text.match(/\s*$/)[0]);
    for(const rule of patterns[lang]||[]){const match=trimmed.match(rule.regex);if(match){const values=Object.fromEntries(rule.slots.map((slot,i)=>[slot,match[i+1]]));return finish(text.match(/^\s*/)[0]+rule.to.replace(/\{(\d+)\}/g,(_,slot)=>values[slot]??'')+text.match(/\s*$/)[0]);}}
    const rule=phrase[lang];return finish(rule?.regex?text.replace(rule.regex,match=>rule.entries.get(match)):text);

  let refresh=()=>{};
  function set(lang,persist=true){
    if(!['es','en'].includes(lang))return;
    language=lang;document.documentElement.lang=lang;document.documentElement.dataset.ctLanguage=lang;
    if(persist)try{localStorage.setItem(key,lang);}catch(_){}
    refresh();window.dispatchEvent(new CustomEvent('coldtrack-language-change',{detail:{language:lang}}));
    for(const frame of document.querySelectorAll('iframe[data-tool-frame]'))try{frame.contentWindow?.ColdTrackLanguage?.set(lang,false);}catch(_){}
  }
  document.documentElement.lang=language;document.documentElement.dataset.ctLanguage=language;
  const confirm=window.confirm.bind(window);window.confirm=message=>confirm(t(message));
  globalThis.ColdTrackLanguage={get current(){return language;},get locale(){return language==='en'?'en-US':'es-US';},t,translator,set,refresh:()=>refresh(),setRefresh:fn=>{refresh=fn;}};
})();
</script>

<script id="coldtrack-appearance-core">/* Appearance is independent of inventory, language and report data. */
(() => {
  'use strict';
  const root = document.documentElement, key = 'coldtrack-theme-v1';
  const presets = [
    {id:'coldtrack', es:'ColdTrack · Claro', en:'ColdTrack · Light', scheme:'light'},
    {id:'dark', es:'Oscuro', en:'Dark', scheme:'dark'},
    {id:'midnight', es:'Azul noche', en:'Midnight blue', scheme:'dark'},
    {id:'emerald', es:'Esmeralda', en:'Emerald', scheme:'dark'},
    {id:'amber', es:'Ámbar', en:'Amber', scheme:'light'},
    {id:'violet', es:'Violeta', en:'Violet', scheme:'dark'},
    {id:'graphite', es:'Grafito', en:'Graphite', scheme:'dark'},
    {id:'ocean', es:'Océano', en:'Ocean', scheme:'light'},
    {id:'deposco', es:'Deposco', en:'Deposco', scheme:'light'},
    {id:'deacom', es:'Deacom', en:'Deacom', scheme:'light'},
    {id:'excel', es:'Excel', en:'Excel', scheme:'light'}
  ];
  const choices = presets.map(preset => preset.id);
  let current = 'coldtrack', portal = null;
  try {if (parent !== window && parent.ColdTrackTheme) portal = parent;} catch (_) {}
  try {current = portal?.ColdTrackTheme.current || localStorage.getItem(key) || root.dataset.ctTheme || current;} catch (_) {current = root.dataset.ctTheme || current;}
  if (!choices.includes(current)) current = 'coldtrack';
  root.dataset.ctTheme = current;
  root.dataset.ctThemeScheme = presets.find(preset => preset.id === current).scheme;
  root.dataset.ctThemeEmbedded = String(!!portal);
  function set(theme, persist = true) {
    if (!choices.includes(theme)) return false;
    const changed = current !== theme;
    current = theme;root.dataset.ctTheme = theme;root.dataset.ctThemeScheme = presets.find(preset => preset.id === theme).scheme;
    if (persist) try {localStorage.setItem(key, theme);} catch (_) {}
    if (changed) window.dispatchEvent(new CustomEvent('coldtrack-theme-change', {detail: {theme}}));
    for (const frame of document.querySelectorAll('iframe[data-tool-frame]')) try {frame.contentWindow?.ColdTrackTheme?.set(theme, false);} catch (_) {}
    return true;
  }
  globalThis.ColdTrackTheme = {get current() {return current;}, get choices() {return [...choices];}, get presets() {return presets.map(preset => ({...preset}));}, set};
  const receive = () => set(portal.ColdTrackTheme.current, false);
  portal?.addEventListener('coldtrack-theme-change', receive);
  window.addEventListener('storage', event => {if (event.key === key) set(event.newValue || 'coldtrack', false);});
  window.addEventListener('pagehide', () => portal?.removeEventListener('coldtrack-theme-change', receive), {once: true});
})();
</script>

<script id="lookup-core">/* BistroMD open-order requirements: exact item joins, no unit conversion. */

    // Rebuild only its options; keep the existing control and event handler.
    if ([...select.options].map(option => option.value).join('|') !== T.choices.join('|')) {
      select.replaceChildren(...presets.map(preset => {const option = document.createElement('option');option.value = preset.id;return option;}));
    }
    [...select.options].forEach((option, index) => {const name = presets[index][en ? 'en' : 'es'];if (option.textContent !== name) option.textContent = name;});
    select.value = T.current;
    control.title = en ? 'Appearance · saved in this browser' : 'Apariencia · se guarda en este navegador';
  }
  control.querySelector('select').addEventListener('change', event => T.set(event.target.value));
  window.addEventListener('coldtrack-theme-change', refresh);
  window.addEventListener('coldtrack-language-change', refresh);
  const languageObserver = new MutationObserver(refresh);
  languageObserver.observe(document.documentElement, {attributes:true, attributeFilter:['lang']});
  window.addEventListener('pagehide', () => languageObserver.disconnect(), {once:true});
  refresh();
})();
</script>
</body></html>
